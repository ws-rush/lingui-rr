name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      ref:
        description: 'Git ref or tag to checkout and publish'
        type: string
        required: false
        default: ''

# Ensure only one publish job runs at a time.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build library
        run: pnpm run build

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Publish package
        run: |
          pnpm pack
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish lingui-rr-*.tgz --provenance --tag next
          else
            npm publish lingui-rr-*.tgz --provenance
          fi
